name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check src tests
      - run: uv run ty check src tests

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        include:
          # File names, paths and time zones behave differently elsewhere.
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.15" }
          - { os: macos-latest, python: "3.15" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  package:
    name: Build & smoke test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv /tmp/env
          uv pip install --python /tmp/env dist/*.whl
          /tmp/env/bin/convoviz --version
          /tmp/env/bin/convoviz --help
          /tmp/env/bin/python -m convoviz --help >/dev/null
