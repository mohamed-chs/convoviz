name: Dependency audit

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Known vulnerabilities in locked dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt > req.txt && uvx pip-audit -r req.txt

  latest:
    name: Tests against the newest dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
      - run: uv sync --upgrade
      - run: uv run pytest
