[project]
name = "convoviz"
version = "1.0.1"
description = "Export your ChatGPT history to Markdown: readable notes for Obsidian, plus private charts and word clouds of how you use ChatGPT."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Cheikh Sidiya", email = "mohamedcheikhsidiya77@gmail.com" }]
keywords = [
  "chatgpt", "chatgpt-export", "conversations", "markdown", "obsidian", "archive", "backup",
  "openai", "notes", "word-cloud", "visualization",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
    "cyclopts>=5.3.2",
    "orjson>=3.13.0",
    "platformdirs>=4.13.6",
    "rich>=15.0.0",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/mohamed-chs/convoviz"
Issues = "https://github.com/mohamed-chs/convoviz/issues"
Changelog = "https://github.com/mohamed-chs/convoviz/blob/main/CHANGELOG.md"

[project.scripts]
convoviz = "convoviz.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ty.environment]
python-version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/golden"]  # byte-exact renderer output; never reformat

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # conflicts with the formatter
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "CPY001",  # no copyright headers
  "PLR2004", # magic values are fine in a format-parsing codebase
  "TRY003",  # long exception messages are fine
  "EM101",   # literal exception messages are fine
  "EM102",
  "C901",    # complexity is reviewed by humans
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "ANN401",  # raw export JSON is genuinely `Any`
  "FBT001",  # keyword-only booleans are enforced by review
  "FBT002",
  "D105",    # magic methods are self-explanatory
  "D107",    # __init__ is documented on the class
  "PLC0415", # deliberate lazy imports
  "RUF001",  # typographic characters (– ’ …) are intentional in user-facing text
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/convoviz/insights.py" = ["E501"]  # inline HTML/SVG templates
"tests/**" = ["S101", "D", "ANN", "PLC0415", "E501", "INP001", "SLF001", "ARG001"]
"scripts/**" = ["INP001", "S603", "T201"]  # maintainer tools, run by hand

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.93",
]
